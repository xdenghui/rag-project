[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.136.1",
    "grandalf>=0.8",
    "langchain>=1.2.16",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "minio>=7.2.20",
    "numpy>=2.4.4",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rag-project = "rag_project:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processor"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
